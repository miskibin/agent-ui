[package]
name = "agent-ui"
version = "0.10.0"
description = "Agent UI desktop shell"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
# `_lib` suffix: a lib and a bin cannot share a name on Windows.
# Desktop-only, so plain `lib`; mobile targets would need cdylib + staticlib.
name = "agent_ui_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.7"
tauri-plugin-os = "2.4"
tauri-plugin-process = "2.4"
tauri-plugin-shell = "2.5"
tauri-plugin-updater = "2.14"

# The kill-on-close job that ties the Node sidecar's life to the shell's
# (`kill_on_close` in lib.rs). Already in the tree through Tauri itself.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[features]
# Enabled automatically by `tauri build`. It is also what `tauri::is_dev()`
# keys off, i.e. what tells the shell to spawn the bundled server instead of
# pointing the window at `build.devUrl`.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
