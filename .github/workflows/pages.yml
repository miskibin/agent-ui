name: Deploy product site to GitHub Pages

on:
  push:
    branches: [main, claude/bingo-app-vercel-v04rdx]
    paths:
      - "website/**"
      - "bingo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bingo/package-lock.json

      # The party bingo app is published beside the product site, under /bingo/.
      - name: Build bingo
        working-directory: bingo
        env:
          BASE_PATH: /agent-ui/bingo/
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p site
          cp -R website/. site/
          cp -R bingo/dist site/bingo

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
