name: Desktop

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "scripts/prepare-desktop.mjs"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "scripts/prepare-desktop.mjs"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check (linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # tauri-build resolves `externalBin` and `bundle.resources` at compile
      # time, so the Node sidecar has to exist even for a type check. This
      # skips the (slow) web build and only fetches the runtime.
      - name: Stage the Node sidecar
        run: node scripts/prepare-desktop.mjs --skip-next

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo check
        run: cargo check --all-targets --manifest-path src-tauri/Cargo.toml
