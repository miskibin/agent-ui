name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

env:
  # The tag being cut: the pushed tag, or the one a manual dispatch asked for.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  # The release is created once, up front, so the bundle jobs upload into the
  # same one instead of four of them racing to create it. It stays a draft
  # until every platform has uploaded, so it never goes public half-populated.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest

    # Scoped per job rather than workflow-wide: every job here writes to the
    # release, but each one says so for itself.
    permissions:
      contents: write

    outputs:
      release_id: ${{ steps.create.outputs.result }}

    steps:
      - uses: actions/github-script@v8
        id: create
        with:
          # `result-encoding: string` keeps the id out of JSON quoting, so it
          # can be passed straight to tauri-action's `releaseId`.
          result-encoding: string
          script: |
            const tag = process.env.RELEASE_TAG
            if (!tag) throw new Error("No release tag resolved for this run")

            // Re-running the workflow for a tag must not create a second
            // release for it.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            })
            const existing = releases.find((release) => release.tag_name === tag)
            if (existing) {
              core.info(`Reusing release ${existing.id} for ${tag}`)
              return existing.id
            }

            // A draft release does not move any ref; the tag is created at
            // `target_commitish` when the publish job flips it to public.
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Agent UI ${tag}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true,
            })
            core.info(`Created release ${data.id} for ${tag}`)
            return data.id

  bundle:
    name: ${{ matrix.label }}
    needs: create-release
    runs-on: ${{ matrix.os }}

    # tauri-action uploads the installers as release assets.
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - label: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""

    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      # Builds the web app and fetches the Node runtime for this target. The
      # flag below then makes tauri's `beforeBuildCommand` a no-op instead of
      # repeating the work.
      - name: Prepare desktop payload
        run: node scripts/prepare-desktop.mjs --target ${{ matrix.target }}
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_UI_DESKTOP_PREPARED: "1"
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # Only now, with every installer attached, does the release become visible.
  publish:
    name: Publish release
    needs: [create-release, bundle]
    runs-on: ubuntu-latest

    # Flipping the release out of draft, and so creating the tag.
    permissions:
      contents: write

    steps:
      - uses: actions/github-script@v8
        # Passed as an environment variable rather than interpolated into the
        # script body: `${{ }}` inside a script is the Actions code-injection
        # pattern, and it is what a static analyser will flag here.
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            })
            core.info(`Published ${process.env.RELEASE_TAG}`)
